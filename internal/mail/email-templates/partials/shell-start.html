{{define "shell-start"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;">
    <div style="max-width: 640px; margin: 24px auto; background: #ffffff; border-radius: 12px; border: 1px solid #e5e5e5; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.06);">
      <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background: #000000;">
        <tr>
          <td align="center" style="padding: 28px 24px;">
            <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: 0.02em;">Haircutz</div>
            <div style="font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-style: italic; color: #ffffff; opacity: 0.85; margin-top: 4px;">by Larry</div>
          </td>
        </tr>
      </table>
      <div style="padding: 32px 28px 24px;">
        <h1 style="margin: 0 0 20px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 700; color: #000000; line-height: 1.3;">{{.Heading}}</h1>
{{end}}
